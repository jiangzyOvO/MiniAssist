[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "miniassist"
version = "0.2.0"
description = "Chinese product support RAG with LangGraph, Elasticsearch and traceable citations"
requires-python = ">=3.10"
dependencies = ["pdfplumber==0.11.9", "pypdf==6.10.0", "lxml==6.1.1"]

[project.optional-dependencies]
rag = ["langgraph==1.2.16", "requests==2.32.5", "pydantic==2.12.3",
       "sentence-transformers==5.1.2", "transformers==4.57.1", "torch==2.9.0"]

[tool.setuptools.packages.find]
where = ["src"]
